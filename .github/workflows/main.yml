name: Build and Test Node.js Application

on:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:
 Execute-test:
   runs-on: ubuntu-latest
   steps:
     - name: get code
       uses: actions/checkout@v3
     - name: Install nodejs
       uses: actions/setup-node@v3
       with:
         node-version: 18
     - name: Install dependencies
       run: npm ci
     - name: Run tests
       run: npm test

     - name: Build Application
       run: npm run build